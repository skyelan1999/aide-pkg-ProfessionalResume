(function(){
 function create(pluginId){
  if(typeof pluginId!=='string'||!/^[A-Za-z0-9_-]{1,64}$/.test(pluginId))throw Error('Invalid plugin id');

   port=e.ports[0];tools=m.tools.slice();capabilities=Array.isArray(m.capabilities)?m.capabilities.filter(x=>typeof x==='string').slice(0,16):[];port.onmessage=event=>{const value=event.data;if(value?.event==='scope.revoked'){revoke('Host scope revoked; verify effects before retry');for(const listener of listeners){try{listener(value);}catch(_){}}return;}if(value?.event){for(const listener of listeners)listener(value);return;}const p=pending.get(value?.requestId);if(!p)return;pending.delete(value.requestId);clearTimeout(p.timer);if(value.status==='error')p.reject(Error(value.error||'Host call failed'));else p.resolve(value);};port.start();clearTimeout(settle?.timer);settle?.resolve({protocol:1,tools:tools.slice(),capabilities:capabilities.slice()});settle=null;

(function(root){

 function fresh(){return {format:'professional-resume',schemaVersion:1,id:uid(),title:'我的职业资料库',revision:0,createdAt:now(),updatedAt:now(),profiles:[],targets:[],resumes:[],applications:[],tasks:[]};}
 function profile(){return {id:uid(),name:'新建个人档案',headline:'',email:'',phone:'',city:'',website:'',summary:'',preferences:'',entries:[],custom:{}};}
 function entry(kind='experience'){return {id:uid(),kind,title:'',organization:'',start:'',end:'',role:'',description:'',contribution:'',outcomes:'',evidence:'',verified:false};}
 function target(){return {id:uid(),company:'',legalName:'',website:'',location:'',role:'',jd:'',salary:'',notes:'',language:'zh-CN',research:null};}
 function validate(db){
  assert(db&&db.format==='professional-resume'&&db.schemaVersion===1,'不支持的资料库版本');
  assert(string(db.id,100)&&db.id&&string(db.title,300)&&Number.isSafeInteger(db.revision)&&db.revision>=0,'资料库元数据错误');
  assert(bytes(db)<=MAX,'当前资料库超过 15 MiB，请拆分为多个 .pr 文件');
  const pids=unique(array(db.profiles)),tids=unique(array(db.targets));unique(array(db.resumes));unique(array(db.applications));unique(array(db.tasks));
  for(const p of db.profiles){assert(string(p.name,300)&&string(p.summary)&&p.custom&&typeof p.custom==='object'&&!Array.isArray(p.custom),'个人档案错误');unique(array(p.entries));for(const e of p.entries)assert(kinds.includes(e.kind)&&string(e.title,500)&&string(e.description)&&string(e.contribution)&&string(e.outcomes)&&string(e.evidence)&&typeof e.verified==='boolean','履历条目错误');}
  for(const t of db.targets)assert(string(t.company,500)&&string(t.role,500)&&string(t.jd,60000)&&['zh-CN','en','bilingual'].includes(t.language),'岗位信息错误');

 function packet(db,profileId,targetId,selected){
  validate(db);const p=db.profiles.find(p=>p.id===profileId),t=db.targets.find(t=>t.id===targetId);assert(p&&t&&t.company.trim()&&t.role.trim()&&t.jd.trim(),'请选择个人档案并填写公司、岗位和职责');
  const chosen=new Set(selected);assert(chosen.size>0,'请至少选择一条履历证据');const entries=p.entries.filter(e=>chosen.has(e.id));assert(entries.length===chosen.size,'履历选择已变化');
  const evidence=entries.map(e=>({id:e.id,kind:e.kind,title:e.title,organization:e.organization,start:e.start,end:e.end,role:e.role,description:e.description,contribution:e.contribution,outcomes:e.outcomes,evidence:e.evidence,verified:e.verified}));

  const value={protocol:1,profileId:p.id,targetId:t.id,databaseId:db.id,createdAt:now(),candidate:{headline:p.headline,summary:p.summary,city:p.city,preferences:p.preferences},evidence,target:cleanTarget};
  assert(bytes(value)<=PACKET_MAX,'本次资料超过 160 KiB，请减少所选条目');return value;

  main.append(notice('另存为不会自动改写原文件；只有宿主保存成功后才切换当前保存位置。导出 Word、Markdown、HTML 时也可选择可写来源，导出完成后恢复 .pr 的文件绑定。'));
 }
 function safeName(name){return name.replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').replace(/^\.+/,'').slice(0,110)||'Professional Resume';}
 async function download(name,bytes){C.assert(bytes.byteLength>0&&bytes.byteLength<=16*1024*1024,'单次导出需在 16 MiB 内');if(parent!==window){const requestId='export_'+(++exportNext),buffer=bytes.slice().buffer;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{exportPending.delete(requestId);reject(Error('宿主未确认导出，请检查宿主版本；未声称文件已保存'));},8000);exportPending.set(requestId,{resolve,reject,timer});parent.postMessage({type:'aide.workbench.export',protocol:1,pluginId:'professional-resume',requestId,name,bytes:buffer},'*',[buffer]);});return;}const url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'})),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('已请求浏览器下载，请检查文件。');}
 async function save(){if(pendingSave)throw Error('请先完成顶部保存或放弃暂存');if(filesAvailable&&(!bound||bound.editable===false))return saveToSource();const revision=db.revision,current=db,bytes=await V.encrypt(C.clone(db),session);C.assert(db===current,'资料库已变化，请重新保存');if(bound&&bound.editable!==false){return stageBytes(bytes,bound,'database',revision,bound);}await download(safeName(filename.replace(/\.pr$/i,''))+'.pr',bytes);saveNote='导出已准备 · 请确认文件保存';updateState();}
 async function lock(auto=false){if(!db)return;if(!auto&&dirty&&!await modal('锁定资料库','当前修改会加密为本窗口内存草稿。请先保存文件；刷新或关闭会丢失未保存草稿。',null,'加密草稿并锁定'))return;pendingBytes=await V.encrypt(db,session);draftLocked=dirty;session=null;db=null;selected.clear();view='home';render();if(auto)toast('15 分钟无操作，资料库已锁定。加密草稿仅保留在当前窗口。');}
 $('#modal-cancel').addEventListener('click',()=>$('#modal').close('cancel'));$('#modal-ok').addEventListener('click',()=>{if($('#modal-form').reportValidity())$('#modal').close('ok');});$('#modal-form').addEventListener('submit',e=>e.preventDefault());$('#modal-form').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();if($('#modal-form').reportValidity())$('#modal').close('ok');}});
 $('#open-file').addEventListener('click',()=>$('#file-input').click());$('#file-input').addEventListener('change',()=>{const file=$('#file-input').files[0];$('#file-input').value='';run(()=>openLocal(file));});$('#save-db').addEventListener('click',()=>run(save));$('#open-source').addEventListener('click',()=>run(openSource));$('#save-as-source').addEventListener('click',()=>run(saveToSource));$('#discard-stage').addEventListener('click',()=>run(discardStage));$('#lock-db').addEventListener('click',()=>run(()=>lock(false)));
 for(const type of ['pointerdown','keydown','input'])document.addEventListener(type,()=>lastActive=Date.now(),{passive:true});setInterval(()=>{if(db&&Date.now()-lastActive>15*60*1000)run(()=>lock(true));},30000);
 window.addEventListener('beforeunload',e=>{if(dirty&&db){e.preventDefault();e.returnValue='';}});
 window.addEventListener('message',e=>{const m=e.data;if(e.source!==parent||m?.protocol!==1||m.requestId!=='export_'+exportNext)return;if(m.type==='aide.workbench.export.status'){const pending=exportPending.get(m.requestId);if(pending){clearTimeout(pending.timer);exportPending.delete(m.requestId);if(m.status==='ready')pending.resolve();else pending.reject(Error(m.error||'导出交接失败'));}toast(m.status==='ready'?'导出已准备，请点击宿主顶部保存文件。':m.status==='requested'?'浏览器已接收保存请求，请核对下载文件。':'导出交接失败，请重试。');}});
 host.onEvent(e=>{if(e.event==='document.saved')void savedEvent(e.result).catch(err=>toast(err.message));if(e.event==='scope.revoked'){connected=false;$('#bridge-state').textContent='Aide 连接已撤销';if(db)run(()=>lock(true));}});
 render();host.connect().then(async info=>{connected=true;filesAvailable=info.capabilities.includes('files.select');$('#bridge-state').textContent='Aide 已连接';updateState();if(info.capabilities.includes('document.read')){try{const reply=await host.documentInfo();bound=reply.result;C.assert(bound.size<=C.MAX+56,'资料库超过当前支持容量');const bytes=await PRFiles.read(host,bound,C.MAX+56);V.header(bytes);pendingBytes=bytes;filename=bound.path?.split('/').pop()||'Professional Resume.pr';render();await unlock(bytes,false);}catch(e){toast(e.message);}}}).catch(()=>{$('#bridge-state').textContent='独立模式 · 本地加密可用';});
})();
